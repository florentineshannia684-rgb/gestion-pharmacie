# =====================================================================
#  Configuration de la connexion a la base de donnees MySQL
#  (Les identifiants ne sont PAS codes en dur dans le code source)
#
#  Vous pouvez surcharger ces valeurs sans recompiler via :
#   - des variables d'environnement : DB_URL, DB_USER, DB_PASSWORD
#   - ou un fichier externe db.properties place a cote du .jar
# =====================================================================

db.url=jdbc:mysql://localhost:3306/pharmacie?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC&characterEncoding=UTF-8
db.user=root
db.password=

# Parametres du pool / connexion
db.driver=com.mysql.cj.jdbc.Driver
